# ===================================================================
# GrievanceTrack — Application Configuration
# ===================================================================
spring.application.name=grievance-track
server.port=8080

# Default Database: Embedded H2 with MySQL 8 Compatibility Mode
# (Ensures zero-setup instant execution anywhere, perfectly simulating MySQL behavior)
spring.datasource.url=jdbc:h2:mem:grievancetrack_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Jackson JSON Date/Time Formatting
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Springdoc OpenAPI / Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# SLA Automation Scheduler Configuration (runs every 60 seconds)
sla.escalation.cron=0 * * * * *
sla.escalation.fixed-rate=60000

# Logging
logging.level.com.grievancetrack=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
